<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Penguin Wallpaper</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      // Bundled default scene — a cheap, self-contained aurora + drifting
      // motes. No external assets. Exposes window.__wallpaperSetPaused(bool)
      // so the host can stop rendering when the desktop isn't visible (P3).
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      let W = 0, H = 0, dpr = 1;
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width = Math.floor(innerWidth * dpr);
        H = canvas.height = Math.floor(innerHeight * dpr);
      }
      resize();
      addEventListener("resize", resize);

      const motes = Array.from({ length: 60 }, () => ({
        x: Math.random(), y: Math.random(),
        r: 0.6 + Math.random() * 1.8,
        vx: (Math.random() - 0.5) * 0.00006,
        vy: (Math.random() - 0.5) * 0.00006,
        a: 0.2 + Math.random() * 0.5,
      }));

      let paused = false;
      let raf = 0;
      let t = 0;
      function frame() {
        t += 0.0016;
        // Vertical gradient base.
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#0b1020");
        g.addColorStop(1, "#15213f");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // Two soft drifting aurora blobs.
        for (let i = 0; i < 2; i++) {
          const cx = (0.35 + 0.3 * i + 0.12 * Math.sin(t * (0.6 + i))) * W;
          const cy = (0.4 + 0.15 * Math.cos(t * (0.5 + i * 0.7))) * H;
          const rad = Math.min(W, H) * (0.45 + 0.08 * Math.sin(t + i));
          const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
          const hue = i === 0 ? "94,234,212" : "129,140,248";
          rg.addColorStop(0, `rgba(${hue},0.16)`);
          rg.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = rg;
          ctx.fillRect(0, 0, W, H);
        }
        // Drifting motes.
        ctx.fillStyle = "#ffffff";
        for (const m of motes) {
          m.x += m.vx; m.y += m.vy;
          if (m.x < 0) m.x += 1; if (m.x > 1) m.x -= 1;
          if (m.y < 0) m.y += 1; if (m.y > 1) m.y -= 1;
          ctx.globalAlpha = m.a * (0.6 + 0.4 * Math.sin(t * 2 + m.x * 10));
          ctx.beginPath();
          ctx.arc(m.x * W, m.y * H, m.r * dpr, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (!paused) raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);

      // Host contract (used from P3 for occlusion/sleep/low-power pausing).
      window.__wallpaperSetPaused = function (p) {
        p = !!p;
        if (p === paused) return;
        paused = p;
        if (!paused) raf = requestAnimationFrame(frame);
        else cancelAnimationFrame(raf);
      };
    </script>
  </body>
</html>
